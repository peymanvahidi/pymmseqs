[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pymmseqs"
version = "1.0.5"
description = "Python wrapper for MMseqs2"
authors = ["peymanvahidi <peyman.vahidi@helmholtz-munich.de>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X"
]
include = [
    # Dict form, because the binary is gitignored and poetry drops VCS-ignored
    # files from the package - the plain string form silently produced 160 KB
    # wheels with no binary in them.
    #
    # Wheel only: an sdist must stay platform-neutral. If it carried a binary,
    # build_hook.py would skip the download and, say, a macOS binary could end
    # up installed on Linux.
    { path = "pymmseqs/bin/*", format = ["wheel"] },
    "pymmseqs/defaults/*.yaml",
    "scripts/*"
]
build = "build_hook.py"

[tool.poetry.dependencies]
python = ">=3.10"
pyyaml = "^6.0.1"
numpy = ">=1.22.4"
pandas = ">=2.2.2"

[tool.poetry.urls]
"Homepage" = "https://github.com/heispv/pymmseqs"
"Documentation" = "https://github.com/heispv/pymmseqs/wiki"
"Bug Tracker" = "https://github.com/heispv/pymmseqs/issues"
