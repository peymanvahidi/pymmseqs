# pymmseqs/defaults/createdb.yaml

fasta_file:
  required: True
  type: path
  default: ""
  choices: null
  description: "The input fasta file"
  twin: False
  should_exist: True

sequence_db:
  required: True
  type: path
  default: ""
  choices: null
  description: "The output sequence database"
  twin: False
  should_exist: False

dbtype:
  required: False
  type: int
  default: 0
  choices: [0, 1, 2]
  description: "Database type 0: auto, 1: amino acid 2: nucleotides"
  twin: False
  should_exist: False

shuffle:
  required: False
  type: bool
  default: True
  choices: [True, False]
  description: "Shuffle the input sequences"
  twin: False
  should_exist: False

createdb_mode:
  required: False
  type: int
  default: 0
  choices: [0, 1, 2]
  description: "Createdb mode 0: copy data, 1: soft link data and write new index (works only with single line fasta/q) 2: GPU compatible db"
  twin: False
  should_exist: False

id_offset:
  required: False
  type: int
  default: 0
  choices: null
  description: "Numeric ids in index file are offset by this value"
  twin: False
  should_exist: False

mask:
  required: False
  type: int
  default: 1
  choices: [0, 1]
  description: "Mask sequences in prefilter stage with tantan: 0: w/o low complexity masking, 1: with low complexity masking"
  twin: False
  should_exist: False

mask_prob:
  required: False
  type: float
  default: 0.9
  choices: null
  description: "Mask sequences if probability is above threshold"
  twin: False
  should_exist: False

mask_lower_case:
  required: False
  type: int
  default: 0
  choices: [0, 1]
  description: "Lowercase letters will be excluded from k-mer search 0: include region, 1: exclude region"
  twin: False
  should_exist: False

mask_n_repeat:
  required: False
  type: int
  default: 0
  choices: null
  description: "Repeat letters that occur > threshold in a row"
  twin: False
  should_exist: False

compressed:
  required: False
  type: bool
  default: False
  choices: [True, False]
  description: "Write compressed output"
  twin: False
  should_exist: False

gpu:
  required: False
  type: int
  default: 0
  choices: [0, 1]
  description: "Use GPU (CUDA) if possible"
  twin: False
  should_exist: False

v:
  required: False
  type: int
  default: 3
  choices: [0, 1, 2, 3]
  description: "Verbosity level: 0: quiet, 1: +errors, 2: +warnings, 3: +info"
  twin: False
  should_exist: False

write_lookup:
  required: False
  type: bool
  default: True
  choices: [True, False]
  description: "write .lookup file containing mapping from internal id, fasta id and file number"
  twin: False
  should_exist: False

threads:
  required: False
  type: int
  default: 'all'
  choices: null
  description: "Number of CPU-cores used (all by default)"
  twin: False
  should_exist: False
